# Определение кластеровclusters = primary, secondary# --- Кластер primary (1st) ---primary.bootstrap.servers = kafka-1st-1:1092,kafka-1st-2:2092,kafka-1st-3:3092primary.security.protocol = SASL_SSLprimary.sasl.mechanism = PLAINprimary.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";primary.ssl.truststore.location = /etc/kafka/secrets/1st/kafka.truststore.jksprimary.ssl.truststore.password = final-work-pass# --- Кластер secondary (2nd)---secondary.bootstrap.servers = kafka-2nd-1:1102,kafka-2nd-2:2102,kafka-2nd-3:3102secondary.security.protocol = SASL_SSLsecondary.sasl.mechanism = PLAINsecondary.sasl.jaas.config = org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";secondary.ssl.truststore.location = /etc/kafka/secrets/2nd/kafka.truststore.jkssecondary.ssl.truststore.password = final-work-passsecondary.ssl.keystore.location = /etc/kafka/secrets/2nd/kafka.keystore.pkcs12secondary.ssl.keystore.password = final-work-passsecondary.ssl.key.password = final-work-pass# --- Включаем репликацию только из primary в secondary ---primary->secondary.enabled = true# secondary->primary.enabled = false# --- Настройки репликации ---replication.policy.separator = .replication.factor = 3sync.group.offsets.enabled = truesync.group.offsets.interval.seconds = 60replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy# Автообнаружение новых топиков и группrefresh.topics.enabled = truerefresh.groups.enabled = true# Создавать топики при необходимости (в приемнике)auto.create.topics.enabled = true# Исключаем служебные топики MM2 и внутренниеprimary->secondary.topics = product|filter-product|event|block-productprimary->secondary.groups = .*# Исключаем топики, начинающиеся с "__" (внутренние) и с именами кластеровprimary->secondary.topics.exclude = __.*|.*\.internal|primary\..*|secondary\..*# Количество потоков для репликацииnum.stream.threads = 4# Интервал проверки новых топиков (мс)refresh.topics.interval.seconds = 10# Интервал синхронизации ACL (если нужно)sync.topic.acls.enabled = false