global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, cluster, instance]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, cluster]
