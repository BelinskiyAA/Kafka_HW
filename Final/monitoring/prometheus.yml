global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: kafka-jmx
    static_configs:
      - targets:
          - kafka-1st-1:7071
          - kafka-1st-2:7071
          - kafka-1st-3:7071
        labels:
          cluster: A
      - targets:
          - kafka-2nd-1:7071
          - kafka-2nd-2:7071
          - kafka-2nd-3:7071
        labels:
          cluster: B

  - job_name: kafka-exporter-1st
    static_configs:
      - targets: ["kafka-exporter-1st:9308"]
        labels:
          cluster: A

  - job_name: kafka-exporter-2nd
    static_configs:
      - targets: ["kafka-exporter-2nd:9308"]
        labels:
          cluster: B

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]