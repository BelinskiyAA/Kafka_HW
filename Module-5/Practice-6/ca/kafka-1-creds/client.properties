security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";

ssl.truststore.location=/etc/kafka/secrets/kafka.kafka-1.truststore.jks
ssl.truststore.password=my-pas-kafka
ssl.keystore.location=/etc/kafka/secrets/kafka.kafka-1.keystore.jks
ssl.keystore.password=my-pas-kafka
ssl.key.password=my-pas-kafka