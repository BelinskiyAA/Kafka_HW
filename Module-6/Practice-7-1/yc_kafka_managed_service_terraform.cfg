resource "yandex_mdb_kafka_cluster" "kafka-practicum-module6" {
  config {
    version = "4.1"
    zones = [
      "ru-central1-b",
      "ru-central1-d",
      "ru-central1-a"
    ]
    brokers_count    = 1
    assign_public_ip = true
    schema_registry  = true
    access {
      data_transfer = false
    }
    rest_api {
      enabled = true
    }
    kafka_ui {
      enabled = true
    }
    disk_size_autoscaling {
      disk_size_limit           = 160
      emergency_usage_threshold = 90
      planned_usage_threshold   = 80
    }
    kafka {
      resources {
        disk_size          = 32
        disk_type_id       = "network-ssd"
        resource_preset_id = "s4a-c2-m8"
      }
    }
  }
  deletion_protection = false
  description         = "Кластер Kafka по заданию модуля 6 курса Яндекс-Практикум"
  environment         = "PRODUCTION"
  folder_id           = "b1g64jb6ir99ragnp68b"
  maintenance_window {
    type = "WEEKLY"
    day  = "MON"
    hour = 3
  }
  name       = "kafka-practicum-module6"
  network_id = "enpfb94o52bo4kt2br2i"
  subnet_ids = [
    "e9b1uuqueupknl05a3r3",
    "e2l6vsgkq5r17gbdra48",
    "fl8aonisus4gr6ncdeie"
  ]
}
